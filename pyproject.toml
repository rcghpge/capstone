[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/rcghpge/capstone"
Repository = "https://github.com/rcghpge/capstone"

[project]
name = "capstone"
version = "0.17.1"
requires-python = ">=3.11,<3.15"
authors = [
  { name = "Robert Cocker"},
  { name = "Landon Nguyen"},
  { name = "Alex Nguyen"},
  { email = "rcocker87@gmail.com"}
]
description = "Health Analytics. Machine learning utilizing key health indicators for infant mortality rate prediction. University of Texas at Arlington."
license = "MIT"
readme = "README.md"
dependencies = [
"cryptography", "jupyterlab", "jupyterlab-widgets", "jupyter", "ipywidgets", "ipykernel", "jax", "jaxlib",  
"pandas", "numpy", "scikit-learn", "rulefit>=0.3.1,<0.4", "xgboost", "scipy", "joblib", "seaborn>=0.13.2,<0.14", 
"matplotlib", "pyale>=1.2.0,<2", "plotly", "pip", "tree>=0.2.4,<0.3", "jupyterlab-widgets", "fonttools", "urllib3", "streamlit", 
"plotly>=6.5.1", "kaggle>=2.0.0,<3", "keras", "pytest>=9.0.2,<10", "pytest-cov>=7.0.0,<8", "nbval>=0.11.0,<0.12", 
"black>=26.1.0,<27", "flake8>=7.3.0,<8", "pre-commit>=4.5.1,<5", "jupyterlab-lsp>=5.2.0,<6", 
"pip-tools>=7.5.3,<8", "bandit>=1.9.3,<2", "pip-audit>=2.10.0,<3", "pybadges>=3.0.1,<4"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4", "pytest-cov", "nbval",
    "black>=23.0", "flake8",
    "bandit>=1.7", "pip-audit>=2.7",
    "pre-commit", "jupyterlab-lsp",
    "pip-tools", "tree"
]

[tool.setuptools.packages.find]
where = ["models"]
include = ["models*"]
namespaces = false

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
capstone = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
keras = ">=3.13.2,<4"
cached-property = ">=1.5.2,<2"
importlib_metadata = ">=8.7.0,<9"
catboost = ">=1.2.10,<2"
streamlit = ">=1.54.0,<2"
xgboost = ">=3.2.0,<4"
jax = ">=0.7.2,<0.8"
jaxlib = ">=0.7.2,<0.8"
scikit-learn = ">=1.8.0,<2"
pip = ">=26.0.1,<27"
voila = ">=0.5.11,<0.6"
python = ">=3.14.2,<3.15"
jupyter-repo2docker = ">=2025.12.0,<2026"
kagglehub = ">=1.0.0,<2"
jupyterlab = ">=4.5.4,<5"
notebook = ">=7.5.3,<8"
jupyterhub = ">=5.4.3,<6"
jupyterlab_widgets = ">=1.1.11,<2"
jupyter = ">=1.1.1,<2"
ipywidgets = ">=7.8.5,<8"
tree = ">=2.3.1,<3"
pixi = ">=0.63.2,<0.64"
git = ">=2.53.0,<3"
cython = ">=3.2.4,<4"
cryptography = ">=46.0.5,<47"
