[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/rcghpge/capstone"
Repository = "https://github.com/rcghpge/capstone"

[project]
name = "capstone"
version = "0.8.0"
authors = [
  { name = "Robert Cocker"},
  { name = "Landon Nguyen"},
  { name = "Alex Nguyen"},
  { email = "rcocker87@gmail.com"}
]
description = "Machine learning utilizing key health indicators for infant mortality rate prediction. University of Texas at Arlington."
license = "MIT"
readme = "README.md"
dependencies = [
"jupyterlab>=4.5.2,<5", "ipykernel>=7.1.0,<8", "pandas>=2.3.3,<3", "numpy", "scikit-learn>=1.8.0,<2", 
"xgboost>=3.1.3,<4", "scipy", "joblib>=1.5.3,<2", "seaborn>=0.13.2,<0.14", "matplotlib>=3.10.8,<4", 
"plotly>=6.5.2,<7", "jupyterlab-widgets>=3.0.16,<4", "fonttools>=4.61.1,<5", "urllib3>=2.6.3,<3", "streamlit>=1.53.0,<2", 
"plotly>=6.5.1", "kaggle>=1.8.3,<2", "keras", "pytest>=9.0.2,<10", "pytest-cov>=7.0.0,<8", "nbval>=0.11.0,<0.12", 
"black>=26.1.0,<27", "flake8>=7.3.0,<8", "pre-commit>=4.5.1,<5", "jupyterlab-lsp>=5.2.0,<6", "pip-tools>=7.5.2,<8", "bandit>=1.9.3,<2", "pip-audit>=2.10.0,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4", "pytest-cov", "nbval",
    "black>=23.0", "flake8",
    "bandit>=1.7", "pip-audit>=2.7",
    "pre-commit", "jupyterlab-lsp",
    "pip-tools"
]

[tool.setuptools.packages.find]
where = ["models"]
include = ["models*"]
namespaces = false

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
capstone = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
jax = ">=0.7.2,<0.8"
keras = ">=3.12.0,<4"
cached-property = ">=1.5.2,<2"
importlib_metadata = ">=8.7.0,<9"
jaxlib = ">=0.7.2,<0.8"
