[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/rcghpge/capstone"
Repository = "https://github.com/rcghpge/capstone"

[project]
name = "capstone"
version = "0.5.0"
authors = [
  { name = "Robert Cocker"},
  { name = "Landon Nguyen"},
  { name = "Alex Nguyen"},
  { email = "rcocker87@gmail.com"}
]
description = "Machine learning utilizing key health indicators for infant mortality rate prediction. University of Texas at Arlington."
license = "MIT"
readme = "README.md"
dependencies = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "scipy>=1.11",
    "joblib>=1.3",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "plotly>=5.17",
    "jupyterlab-widgets",
    "fonttools>=4.61.0", 
    "urllib3>=2.6.0",
    "streamlit>=1.53.0",
    "plotly>=6.5.1",
    "kaggle>=1.8.3",
    "keras>=3.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4", "pytest-cov", "nbval",
    "black>=23.0", "flake8",
    "bandit>=1.7", "pip-audit>=2.7",
    "pre-commit", "jupyterlab-lsp",
    "pip-tools"
]

[tool.setuptools.packages.find]
where = ["models"]
include = ["models*"]
namespaces = false
