name: Pre-build Binder Image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout files
      uses: actions/checkout@v4

    - name: Build Red Hat/Binder container image & push to DockerHub + Binder cache
      uses: jupyterhub/repo2docker-action@master
      with:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        IMAGE_NAME: rcdpge/capstone-binder 
        BINDER_CACHE: true        
        COMMIT_MSG: "Set Binder development environment (pre-build Binder container image)"
        MYBINDERORG_TAG: true      
