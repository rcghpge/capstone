name: Binder Container Image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Run Disk Cleanup 
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc && df -h

    - name: Checkout  
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build/Push DockerHub 
      uses: jupyterhub/repo2docker-action@master # latest version is 0.2
      with:
        DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        DOCKER_REGISTRY: "docker.io"
        LATEST_TAG_OFF: true
        BINDER_CACHE: true
        # MYBINDERORG_TAG: false  # ca-cert/ssl conflicts
        IMAGE_NAME: "rcdpge/capstone-binder"
        PUBLIC_REGISTRY_CHECK: true

    - name: Run Disk Checks
      run: df -h
