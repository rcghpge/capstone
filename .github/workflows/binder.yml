name: Binder Container Image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Run Build Checks + Disk Cleanup 
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yqq ca-certificates curl gnupg lsb-release
        sudo update-ca-certificates --fresh
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        df -h

    - name: Checkout  
      uses: actions/checkout@v4

    - name: Cache repo2docker  
      uses: actions/cache@v4
      with:
        path: ~/.cache/repo2docker
        key: repo2docker-${{ hashFiles('Dockerfile', 'pyproject.toml', '**/*.txt') }}

    - name: Build/Push DockerHub 
      uses: jupyterhub/repo2docker-action@master
      with:
        DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        DOCKER_REGISTRY: "docker.io"
        LATEST_TAG_OFF: true
        BINDER_CACHE: true
        MYBINDERORG_TAG: true
        IMAGE_NAME: "rcdpge/capstone-binder"

    - name: Run Disk Checks
      run: df -h
